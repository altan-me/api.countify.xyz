<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Countify - Sign up</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container nav-inner">
        <a class="brand" href="/">👌 countify.xyz</a>
        <button class="nav-toggle" aria-label="Toggle navigation" onclick="toggleNav(event)">☰</button>
        <div class="nav-links" id="primaryNav">
          <a href="/dashboard" class="{{ 'active' if request.path.startswith('/dashboard') else '' }}">📊 Dashboard</a>
          {% if g.user %}
          <div class="user-menu">
            <button class="user-btn" onclick="toggleUserMenu(event)">{{ g.user.username[:1] | upper }}</button>
            <div class="user-dropdown" id="userDropdown">
              <div class="section">
                <div><strong>👤 {{ g.user.username }}</strong></div>
                <div class="muted">Signed in</div>
              </div>
              <div class="section">
                <form method="post" action="/logout" onsubmit="return confirmLogout()">
                  <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}" />
                  <button type="submit" class="btn danger" style="width:100%">🚪 Log out</button>
                </form>
              </div>
            </div>
          </div>
          {% else %}
          <a href="/login" class="{{ 'active' if request.path.startswith('/login') else '' }}">🔐 Login</a>
          <a href="/signup" class="{{ 'active' if request.path.startswith('/signup') else '' }}">🆕 Sign up</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container" style="padding-top: 40px;">
      <h1>🆕 Sign up</h1>
      {% if error %}
      <div class="alert">{{ error }}</div>
      {% endif %}
      <form method="post" class="form">
        <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}" />
        <div class="form-row">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]+" required />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="8" required />
        </div>
        <div class="form-row">
          <label for="confirm">Confirm Password</label>
          <input id="confirm" name="confirm" type="password" minlength="8" required />
        </div>
        <button type="submit" class="btn">Create account</button>
      </form>
    </main>

    

    <script>
      function toggleNav(e){
        e.preventDefault();
        const nav = document.getElementById('primaryNav');
        if(!nav) return;
        nav.classList.toggle('open');
        const btn = e.currentTarget || e.target;
        if(btn && btn.classList && btn.classList.contains('nav-toggle')){
          btn.setAttribute('aria-expanded', nav.classList.contains('open') ? 'true' : 'false');
        }
        nav.querySelectorAll('a').forEach(a => {
          a.addEventListener('click', () => nav.classList.remove('open'), { once: true });
        });
      }
      function toggleUserMenu(e){
        e.preventDefault();
        const dd = document.getElementById('userDropdown');
        dd.classList.toggle('open');
        document.addEventListener('click', function handler(ev){
          if(!dd.contains(ev.target) && ev.target !== e.target){ dd.classList.remove('open'); document.removeEventListener('click', handler); }
        });
      }
      function confirmLogout(){
        return confirm('Are you sure you want to log out?');
      }
    </script>
  </body>
  </html>
