<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Countify - Login</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container nav-inner">
        <a class="brand" href="/">👌 countify.xyz</a>
        <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
        <div class="nav-links" id="primaryNav">
          <a href="/dashboard" class="{{ 'active' if request.path.startswith('/dashboard') else '' }}">📊 Dashboard</a>
          {% if g.user %}
          <form method="post" action="/logout">
            <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}" />
            <button type="submit" class="linkish">Log out</button>
          </form>
          {% else %}
          <a href="/login" class="{{ 'active' if request.path.startswith('/login') else '' }}">🔐 Login</a>
          <a href="/signup" class="{{ 'active' if request.path.startswith('/signup') else '' }}">🆕 Sign up</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container" style="padding-top: 40px;">
      <h1>🔐 Login</h1>
      {% if error %}
      <div class="alert">{{ error }}</div>
      {% endif %}
      <form method="post" class="form">
        <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}" />
        <div class="form-row">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" required />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required />
        </div>
        <button type="submit" class="btn">Sign in</button>
      </form>
    </main>

    
    <script nonce="{{ g.csp_nonce }}">
      function toggleNav(e){
        e.preventDefault();
        const nav = document.getElementById('primaryNav');
        if(!nav) return;
        nav.classList.toggle('open');
        const btn = e.currentTarget || e.target;
        if(btn && btn.classList && btn.classList.contains('nav-toggle')){
          btn.setAttribute('aria-expanded', nav.classList.contains('open') ? 'true' : 'false');
        }
        nav.querySelectorAll('a').forEach(a => {
          a.addEventListener('click', () => nav.classList.remove('open'), { once: true });
        });
      }
      function confirmLogout(){
        return confirm('Are you sure you want to log out?');
      }
      // Attach listeners
      const navToggle = document.querySelector('.nav-toggle');
      if(navToggle){ navToggle.addEventListener('click', toggleNav); }
      const logoutForm = document.querySelector('form[action="/logout"]');
      if(logoutForm){ logoutForm.addEventListener('submit', (e) => { if(!confirmLogout()) e.preventDefault(); }); }
    </script>
  </body>
  </html>
